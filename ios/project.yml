name: XiaokeEffects
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XiaokeEffects:
    type: application
    platform: iOS
    sources:
      - path: XiaokeEffects
      - path: web            # 和線上版同一份網頁（sync.sh 複製進來），整個資料夾放進 App
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokeeffects
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP   # Yu-Juh Wu (Personal Team)；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaokeEffects/Info.plist
      properties:
        CFBundleDisplayName: 小柯特效
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: 把輸出的影片、GIF、圖片存到「照片」
        NSPhotoLibraryUsageDescription: 從「照片」選取圖片或影片當素材
        NSCameraUsageDescription: 拍攝照片或影片當素材
        NSMicrophoneUsageDescription: 錄影時錄下聲音
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: 小柯特效專案
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.achir.xiaokeeffects.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.achir.xiaokeeffects.project
            UTTypeDescription: 小柯特效專案
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xke
schemes:
  XiaokeEffects:
    build:
      targets:
        XiaokeEffects: all
    run:
      config: Debug
    archive:
      config: Release
